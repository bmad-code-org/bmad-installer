beforeSkillsPicker: |-
  The skills CLI takes over for the first install.
  Pick the coding agents to install to.
  If it asks for a scope, keep Project.
  If it asks for a method, keep Symlink.
  Confirm, and this installer picks up again when it is done.

firstInstallNotInProject: |-
  The skills CLI did not install into {directory}.
  Nothing was added to this project.
  If you picked Global scope, the skills went to the global skills dir.
  Run the installer again and keep the Project scope.


intro: |-
  BMad Installer installs BMad modules as agent skills.
  It is free and open source.
  Installs run through the skills CLI (npx skills). You need uv installed.

  Docs     https://docs.bmad-method.org
  GitHub   https://github.com/bmad-code-org/BMAD-METHOD
  Discord  https://discord.gg/gk8jAdXWmj
  YouTube  https://www.youtube.com/@BMadCode
  X        https://x.com/BMadCode

  Support: star the repo, https://buymeacoffee.com/bmad
  Contact: contact@bmadcode.com

updateAvailable: |-
  You are using version {current} but {latest} is available.
  To update, exit and first run:
  npm cache clean --force && npx bmad-method@{tag} install

nodeTooOld: |-
  Node {version} is too old. This installer needs Node 22 or newer.
  Install Node 22, then run this again.

nodeBelowSkillsFloor: |-
  Node {version} is below the 22.20.0 the skills CLI asks for.
  Installs usually still work. Upgrade Node if you hit errors.

uvMissing: |-
  uv is not installed. The BMad scripts need it.
  Install it with:
  {installCommand}
  More ways: https://docs.astral.sh/uv/getting-started/installation/

uvInstall:
  darwin: "curl -LsSf https://astral.sh/uv/install.sh | sh"
  linux: "curl -LsSf https://astral.sh/uv/install.sh | sh"
  win32: 'powershell -c "irm https://astral.sh/uv/install.ps1 | iex"'

wslWindowsNode: |-
  This is Windows Node.js started from a WSL shell.
  Install Node inside WSL and run this again from the WSL terminal.

needsTerminal: |-
  This installer needs an interactive terminal.
  Run it in a terminal, or add --yes to install without prompts.

insideAgent: |-
  This is running inside {agent}.
  Run the installer in a terminal, or add --yes to install without prompts.


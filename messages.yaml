closing: |-
  BMad is installed in:
  {directory}
  Open your coding agent in this directory.

  Ask it to run: bmad setup
  Setup asks the configuration questions and finishes the install.
  Configuration and customization are its job from now on.

  Three ways to change this install later:
    ask the bmad skill
    npx bmad-method update
    npx skills update

  npx skills remove removes skills. This installer never removes anything.

  Going direct with the skills CLI: a module is its bmod-<code> record
  skill plus the skills it requires.
  A partial install is one the bmad skill cannot see or run.

  After adding or updating any skill by any route,
  ask the bmad skill to update. Only it reconciles what is installed.

cancelled: "Cancelled. Anything already installed is still there."


# `source` is the module's folder: `owner/repo/path`, or `owner/repo` when the repository holds one module. The installer runs one `npx skills add <source> -s '*'` per module.
# `record` is the skill holding the module's [bmod] table: a bmod-* record that lists the module's skills, or, for a module of one skill, that skill itself.
modules:
  - code: core-tools
    name: BMad Core Tools
    description: Brainstorming, research, review, party mode, customization
    source: bmad-code-org/BMAD-METHOD/skills/core-tools
    record: bmod-core-tools
    always: true

  - code: method
    aliases: [bmm]
    name: BMad Method
    description: Plan, spec and build software with agile AI agents
    source: bmad-code-org/BMAD-METHOD/skills/method
    record: bmod-method
    default: true

  - code: toolsmith
    name: BMad Toolsmith
    description: Build, convert, review and package skills, agents and modules
    source: bmad-code-org/BMAD-METHOD/skills/toolsmith
    record: bmod-toolsmith
    default: true

  - code: founder
    name: BMad Founder
    description: Nadia the Founder Advisor, for the business side of a startup
    source: bmad-code-org/BMAD-METHOD/skills/founder
    record: bmad-founder-agent-advisor

  - code: cis
    name: BMad Creative Intelligence Suite
    description: Innovation, brainstorming, problem-solving
    source: bmad-code-org/bmad-module-creative-intelligence-suite
    record: bmod-cis
